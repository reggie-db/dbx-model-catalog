[build-system]
requires = [
  "datamodel-code-generator==0.86.0",
  "hatchling>=1.28,<2",
]
build-backend = "hatchling.build"

[project]
name = "dbx-model-catalog"
version = "0.1.0"
description = "Typed Python client and sync library for the Databricks model catalog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "brotli>=1.1,<2",
  "diskcache>=5.6,<6",
  "pydantic>=2.14,<3",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
sync = [
  "huggingface-hub>=1.0,<2",
  "pyarrow>=22,<24",
]

[tool.hatch.build]
include = [
  "hatch_build.py",
  "scripts/generate_models.py",
  "src/dbx_model_catalog/**/*.py",
  "src/dbx_model_catalog/py.typed",
  "src/dbx_model_catalog/schema/*.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dbx_model_catalog"]
artifacts = ["dist-node/*.tgz"]

[tool.hatch.build.targets.sdist]
artifacts = ["dist-node/*.tgz"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

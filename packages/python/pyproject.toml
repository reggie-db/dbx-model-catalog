[build-system]
requires = [
  "datamodel-code-generator==0.86.0",
  "hatchling>=1.28,<2",
]
build-backend = "hatchling.build"

[project]
name = "dbx-model-catalog"
version = "0.1.0"
description = "Typed Python client for the published Databricks model catalog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "brotli>=1.1,<2",
  "pydantic>=2.14,<3",
]

[tool.hatch.build]
include = [
  "scripts/generate_models.py",
  "src/dbx_model_catalog/**/*.py",
  "src/dbx_model_catalog/py.typed",
  "src/dbx_model_catalog/schema/*.json",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dbx_model_catalog"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

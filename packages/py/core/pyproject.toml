[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "dbx-model-catalog"
version = "0.2.0"
description = "Shared Pydantic models and query services for the Databricks model catalog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "brotli>=1.1,<2",
  "diskcache>=5.6,<6",
  "platformdirs>=4.3,<5",
  "pydantic>=2.14,<3",
  "python-dateutil>=2.9,<3",
  "rapidfuzz>=3.14,<4",
]

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/dbx_model_catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]

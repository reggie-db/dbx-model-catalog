[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "dbx-model-catalog-sync"
version = "0.1.0"
description = "Source ingestion and normalization for dbx-model-catalog"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "dbx-model-catalog",
  "diskcache>=5.6,<6",
  "huggingface-hub>=1.0,<2",
  "pyarrow>=22,<24",
  "python-dateutil>=2.9,<3",
]

[project.scripts]
dbx-model-catalog-sync = "dbx_model_catalog_sync.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/dbx_model_catalog_sync"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
dbx-model-catalog = { workspace = true }

[project]
name = "dbx-model-catalog-workspace"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.hatch.envs.default]
detached = true
dependencies = [
  "beautifulsoup4>=4.14,<5",
  "brotli>=1.1,<2",
  "datamodel-code-generator==0.86.0",
  "diskcache>=5.6,<6",
  "hatchling>=1.28,<2",
  "platformdirs>=4.3,<5",
  "pydantic>=2.14,<3",
  "pytest>=8.4,<9",
  "python-dateutil>=2.9,<3",
]

[tool.hatch.envs.default.env-vars]
PYTHONPATH = "packages/python/src"

[tool.hatch.envs.default.scripts]
test = "pytest packages/python/tests"
schema = "python packages/python/scripts/generate_models.py"
node-generate = "bun run --cwd packages/node generate"
node-build = "bun run --cwd packages/node build"
node-pack = "bun run --cwd packages/node pack"
node-test = "bun run --cwd packages/node test"
build = [
  "hatch run schema",
  "hatch run node-generate",
  "hatch run node-build",
  "cd packages/python && hatch build",
]
check = [
  "hatch run test",
  "hatch run node-test",
  "hatch run node-build",
]

[tool.hatch.envs.publish]
detached = true

[tool.hatch.envs.publish.scripts]
python = "hatch publish packages/python/dist/*"
node = "bun publish --cwd packages/node"

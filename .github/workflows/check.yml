name: Check

on:
  merge_group:
    types:
      - checks_requested
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    outputs:
      publish_container: ${{ steps.container_changes.outputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect container changes
        id: container_changes
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          publish=false

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            publish=true
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              changed_files="$(git ls-tree -r --name-only "$GITHUB_SHA")"
            else
              changed_files="$(git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA")"
            fi

            while IFS= read -r changed_file; do
              case "$changed_file" in
                packages/js/web/catalog/* | packages/js/web/catalog.json | packages/js/web/catalog.sqlite | packages/js/web/search-index.json)
                  continue
                  ;;
                .dockerignore | .github/workflows/check.yml | Dockerfile | docker/* | package.json | tsconfig.json | packages/js/client/* | packages/js/static-server/* | packages/js/web/* | scripts/container-*)
                  publish=true
                  break
                  ;;
              esac
            done <<< "$changed_files"
          fi

          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          download-from-astral-mirror: true
          enable-cache: true
          python-version: "3.12"
          version: latest-known
      - name: Install Node dependencies
        run: bun install
      - name: Run workspace checks
        run: bun run check
      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dbx-model-catalog-build
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.whl
            packages/js/client/dist
            packages/js/web/dist

  publish-container:
    name: Publish container
    needs: check
    if: ${{ needs.check.result == 'success' && needs.check.outputs.publish_container == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-
      - name: Build and push image
        env:
          CONTAINER_CACHE_FROM: type=gha,scope=model-catalog-ui
          CONTAINER_CACHE_TO: type=gha,mode=max,scope=model-catalog-ui
          CONTAINER_IMAGE: ${{ env.IMAGE_NAME }}
          CONTAINER_LABELS: ${{ steps.metadata.outputs.labels }}
          CONTAINER_TAGS: ${{ steps.metadata.outputs.tags }}
        run: bun run container:publish
      - name: Verify anonymous image access
        env:
          CONTAINER_EXPECTED_REVISION: ${{ github.sha }}
          CONTAINER_IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: bun run container:verify

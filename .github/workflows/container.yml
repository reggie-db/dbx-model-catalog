name: Publish container

on:
  push:
    branches:
      - main
    paths:
      - .dockerignore
      - .github/workflows/container.yml
      - Dockerfile
      - docker/**
      - package.json
      - tsconfig.json
      - packages/js/client/**
      - packages/js/static-server/**
      - packages/js/web/**
      - scripts/container-*
      - "!packages/js/web/catalog/**"
      - "!packages/js/web/catalog.json"
      - "!packages/js/web/catalog.sqlite"
      - "!packages/js/web/search-index.json"
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-container-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long,prefix=sha-
      - name: Build and push image
        env:
          CONTAINER_CACHE_FROM: type=gha,scope=model-catalog-ui
          CONTAINER_CACHE_TO: type=gha,mode=max,scope=model-catalog-ui
          CONTAINER_IMAGE: ${{ env.IMAGE_NAME }}
          CONTAINER_LABELS: ${{ steps.metadata.outputs.labels }}
          CONTAINER_TAGS: ${{ steps.metadata.outputs.tags }}
        run: bun run container:publish
      - name: Verify anonymous image access
        env:
          CONTAINER_EXPECTED_REVISION: ${{ github.sha }}
          CONTAINER_IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: bun run container:verify

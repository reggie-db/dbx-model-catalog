name: Configure model catalog domain

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out dbx-tools DNS configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reggie-db/dbx-tools
          ref: 4228497ef91e2897c6d804ea1a65b5aedfe9772b
      - name: Configure Cloudflare DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DOMAIN: model-catalog.dbx.tools
          PAGES_HOST: reggie-db.github.io
          ZONE: dbx.tools
        run: scripts/configure-pages-dns.sh

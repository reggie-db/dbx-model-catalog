name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          download-from-astral-mirror: true
          enable-cache: true
          python-version: "3.12"
          version: latest-known
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: bun install
      - name: Run workspace checks
        run: bun run check
      - name: Build release packages
        run: |
          mkdir -p release/npm release/python
          while IFS= read -r manifest; do
            if node -e '
              const fs = require("node:fs");
              const pkg = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              process.exit(pkg.private === true || !pkg.version ? 1 : 0);
            ' "$manifest"; then
              package_dir="$(dirname "$manifest")"
              (cd "$package_dir" && bun pm pack --destination "$GITHUB_WORKSPACE/release/npm")
            fi
          done < <(find packages/js -mindepth 2 -maxdepth 2 -name package.json -print | sort)
          uv build --all-packages --wheel --out-dir release/python --no-sources
      - name: Validate packages
        run: |
          shopt -s nullglob
          NPM_PACKAGES=(release/npm/*.tgz)
          PYTHON_WHEELS=(release/python/*.whl)
          test "${#NPM_PACKAGES[@]}" -gt 0
          test "${#PYTHON_WHEELS[@]}" -gt 0
          for package in "${NPM_PACKAGES[@]}"; do
            bunx publint@0.3.25 --strict "$package"
            bunx @arethetypeswrong/cli@0.18.5 --profile esm-only "$package"
          done
      - name: Ensure npm is current
        run: |
          npm install --global npm@latest
          npm --version
      - name: Verify npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm whoami --registry https://registry.npmjs.org
      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          for tarball in "$PWD"/release/npm/*.tgz; do
            read -r PACKAGE VERSION < <(
              tar -xOf "$tarball" package/package.json |
                node -e '
                  const fs = require("node:fs");
                  const pkg = JSON.parse(fs.readFileSync(0, "utf8"));
                  console.log(pkg.name, pkg.version);
                '
            )
            if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
              echo "$PACKAGE@$VERSION is already published."
              continue
            fi

            PUBLISH_LOG="$(mktemp)"
            set +e
            npm publish "$tarball" --access public 2>&1 | tee "$PUBLISH_LOG"
            PUBLISH_STATUS="${PIPESTATUS[0]}"
            set -e
            if [ "$PUBLISH_STATUS" -ne 0 ] && grep -Eq 'previously (published|staged) version' "$PUBLISH_LOG"; then
              echo "$PACKAGE@$VERSION was already accepted by the registry."
              PUBLISH_STATUS=0
            fi
            rm -f "$PUBLISH_LOG"
            test "$PUBLISH_STATUS" -eq 0
          done
      - name: Upload release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          if-no-files-found: error
          path: |
            release/npm/*.tgz
            release/python/*.whl
          retention-days: 7

  release-assets:
    name: Publish GitHub release assets
    needs:
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-packages
          path: ${{ runner.temp }}/release
      - name: Upload packages to GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/release
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null
          shopt -s nullglob
          ASSETS=("$RELEASE_DIR"/npm/*.tgz "$RELEASE_DIR"/python/*.whl)
          test "${#ASSETS[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber

name: Release

on:
  push:
    tags:
      - v*.*.*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  publish-npm:
    name: Publish npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          download-from-astral-mirror: true
          enable-cache: true
          python-version: "3.12"
          version: latest-known
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: bun install
      - name: Run workspace checks
        run: bun run check
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          while IFS= read -r manifest; do
            read -r PACKAGE PRIVATE VERSION < <(
              node -e '
                const fs = require("node:fs");
                const pkg = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                console.log(pkg.name, pkg.private === true, pkg.version ?? "");
              ' "$manifest"
            )
            if [ "$PRIVATE" = "false" ] && [ -n "$VERSION" ]; then
              test "v$VERSION" = "$RELEASE_TAG" || {
                echo "$PACKAGE@$VERSION does not match $RELEASE_TAG."
                exit 1
              }
            fi
          done < <(find packages/js -mindepth 2 -maxdepth 2 -name package.json -print | sort)
      - name: Build npm packages
        run: |
          mkdir -p release/npm
          while IFS= read -r manifest; do
            if node -e '
              const fs = require("node:fs");
              const pkg = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              process.exit(pkg.private === true || !pkg.version ? 1 : 0);
            ' "$manifest"; then
              package_dir="$(dirname "$manifest")"
              (cd "$package_dir" && bun pm pack --destination "$GITHUB_WORKSPACE/release/npm")
            fi
          done < <(find packages/js -mindepth 2 -maxdepth 2 -name package.json -print | sort)
      - name: Validate npm packages
        run: |
          shopt -s nullglob
          NPM_PACKAGES=(release/npm/*.tgz)
          test "${#NPM_PACKAGES[@]}" -gt 0
          for package in "${NPM_PACKAGES[@]}"; do
            bunx publint@0.3.25 --strict "$package"
            bunx @arethetypeswrong/cli@0.18.5 --profile esm-only "$package"
          done
      - name: Install a trusted-publishing npm version
        run: |
          npm install --global npm@11.20.0
          npm --version
      - name: Publish npm packages
        run: |
          for tarball in "$PWD"/release/npm/*.tgz; do
            read -r PACKAGE VERSION < <(
              tar -xOf "$tarball" package/package.json |
                node -e '
                  const fs = require("node:fs");
                  const pkg = JSON.parse(fs.readFileSync(0, "utf8"));
                  console.log(pkg.name, pkg.version);
                '
            )
            if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
              echo "$PACKAGE@$VERSION is already published."
              continue
            fi

            PUBLISH_LOG="$(mktemp)"
            set +e
            npm publish "$tarball" --access public --provenance 2>&1 | tee "$PUBLISH_LOG"
            PUBLISH_STATUS="${PIPESTATUS[0]}"
            set -e
            if [ "$PUBLISH_STATUS" -ne 0 ] && grep -Eq 'previously (published|staged) version' "$PUBLISH_LOG"; then
              echo "$PACKAGE@$VERSION was already accepted by the registry."
              PUBLISH_STATUS=0
            fi
            rm -f "$PUBLISH_LOG"
            test "$PUBLISH_STATUS" -eq 0
          done
      - name: Upload npm packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-packages
          if-no-files-found: error
          path: release/npm/*.tgz
          retention-days: 7

  publish-pypi:
    name: Publish ${{ matrix.distribution }} to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    environment: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: dbx-model-catalog
            project_directory: packages/py/core
            artifact: dbx-model-catalog
            environment: pypi-dbx-model-catalog
          - distribution: dbx-model-catalog-server
            project_directory: packages/py/server
            artifact: dbx-model-catalog-server
            environment: pypi-dbx-model-catalog-server
          - distribution: dbx-model-catalog-sync
            project_directory: packages/py/sync
            artifact: dbx-model-catalog-sync
            environment: pypi-dbx-model-catalog-sync
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          download-from-astral-mirror: true
          enable-cache: true
          python-version: "3.12"
          version: latest-known
      - name: Validate release tag
        env:
          PROJECT_DIRECTORY: ${{ matrix.project_directory }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          PROJECT_TAG="v$(uv version --project "$PROJECT_DIRECTORY" --short)"
          test "$PROJECT_TAG" = "$RELEASE_TAG" || {
            echo "${{ matrix.distribution }} $PROJECT_TAG does not match $RELEASE_TAG."
            exit 1
          }
      - name: Build Python distribution
        env:
          DISTRIBUTION_DIRECTORY: ${{ runner.temp }}/python-distribution
          PROJECT_DIRECTORY: ${{ matrix.project_directory }}
        run: uv build --project "$PROJECT_DIRECTORY" --out-dir "$DISTRIBUTION_DIRECTORY" --no-sources
      - name: Publish Python distribution
        if: github.event_name == 'push'
        env:
          DISTRIBUTION_DIRECTORY: ${{ runner.temp }}/python-distribution
        run: >-
          uv publish --trusted-publishing always
          --check-url https://pypi.org/simple
          "$DISTRIBUTION_DIRECTORY"/*
      - name: Upload Python wheel
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ runner.temp }}/python-distribution/*.whl
          retention-days: 7

  release-assets:
    name: Publish GitHub release assets
    needs:
      - publish-npm
      - publish-pypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download npm packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: ${{ runner.temp }}/release/npm
      - name: Download Python wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-package-*
          merge-multiple: true
          path: ${{ runner.temp }}/release/python
      - name: Upload packages to GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_DIR: ${{ runner.temp }}/release
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
          shopt -s nullglob
          ASSETS=("$RELEASE_DIR"/npm/*.tgz "$RELEASE_DIR"/python/*.whl)
          test "${#ASSETS[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi

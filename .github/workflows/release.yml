name: Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          download-from-astral-mirror: true
          enable-cache: true
          python-version: "3.12"
          version: latest-known
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: bun install
      - name: Run workspace checks
        run: bun run check
      - name: Pack client
        run: |
          mkdir -p release
          cd packages/js/client
          bun pm pack --destination ../../../release
      - name: Validate package
        run: |
          TARBALL="$(find release -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$TARBALL"
          bunx publint@0.3.25 --strict "$TARBALL"
          bunx @arethetypeswrong/cli@0.18.5 --profile esm-only "$TARBALL"
      - name: Ensure npm is current
        run: |
          npm install --global npm@latest
          npm --version
      - name: Publish client
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          TARBALL="$(find "$PWD/release" -maxdepth 1 -name '*.tgz' -print -quit)"
          PACKAGE="$(node -p "require('./packages/js/client/package.json').name")"
          VERSION="$(node -p "require('./packages/js/client/package.json').version")"
          if npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
            echo "$PACKAGE@$VERSION is already published."
          else
            test -n "$NODE_AUTH_TOKEN"
            PUBLISH_LOG="$(mktemp)"
            set +e
            npm publish "$TARBALL" --access public 2>&1 | tee "$PUBLISH_LOG"
            PUBLISH_STATUS="${PIPESTATUS[0]}"
            set -e
            if [ "$PUBLISH_STATUS" -eq 0 ]; then
              exit 0
            fi
            if grep -Eq 'previously (published|staged) version' "$PUBLISH_LOG"; then
              echo "$PACKAGE@$VERSION was already accepted by the registry."
              exit 0
            fi
            exit "$PUBLISH_STATUS"
          fi

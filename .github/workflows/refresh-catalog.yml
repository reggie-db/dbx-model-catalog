name: Publish catalog

on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          download-from-astral-mirror: true
          enable-cache: true
          python-version: "3.12"
          version: latest-known
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install Node dependencies
        run: bun install
      - name: Build published catalog
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bun run sync --refresh --output-directory packages/js/web
      - name: Validate catalog database
        run: |
          uv run --project packages/py/core python - <<'PY'
          import sqlite3

          with sqlite3.connect("packages/js/web/catalog.sqlite") as database:
              result = database.execute("PRAGMA integrity_check").fetchone()
          if result != ("ok",):
              raise SystemExit(f"SQLite integrity check failed: {result}")
          PY
      - name: Commit catalog updates
        run: |
          if git diff --quiet -- packages/js/web/catalog.json packages/js/web/search-index.json packages/js/web/catalog.sqlite; then
            echo "Catalog is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/js/web/catalog.json packages/js/web/search-index.json packages/js/web/catalog.sqlite
          git commit -m "Refresh published model catalog"
          git pull --rebase
          git push
